    <title>手语即时通</title>
    <script type="module" crossorigin src="./assets/index-D6FiZNQf.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-41TaRmzF.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="root">
      <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#0ea5e9;background:#f8fafc;">
        <div style="width:36px;height:36px;border:3px solid #bae6fd;border-top-color:#0ea5e9;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div style="font-size:15px;">手语即时通加载中…</div>
      </div>
    </div>
    <script>
      // 看门狗：若 8 秒后 React 仍未挂载，说明脚本未执行（网络/Service Worker 缓存问题）
      window.__APP_BOOTED__ = false;
      setTimeout(function () {
        if (window.__APP_BOOTED__) return;
        var s = document.getElementById('boot-splash');
        if (s) {
          s.style.color = '#b91c1c';
          s.innerHTML =
            '<div style="max-width:320px;text-align:center;line-height:1.7;font-size:14px;padding:0 20px;">' +
            '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">页面脚本未能加载</div>' +
            '请依次尝试：<br/>1. 关闭本页面，用手机浏览器重新打开链接<br/>' +
            '2. 若已“添加到主屏幕”，请先删除该图标，再用浏览器打开<br/>' +
            '3. 浏览器设置中清除本站数据（站点设置 → 存储 → 删除）<br/>' +
            '4. 确认手机网络可访问该网址</div>';
        }
      }, 8000);
    </script>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </body>
